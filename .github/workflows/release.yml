name: Облачная сборка и обновление APK 🤖

on:
  push:
    branches: [ main, master ]

# ИСПРАВЛЕНИЕ: Даем облачному сборщику официальные права на создание и перезапись релизов
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission to Gradle
        run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew assembleRelease

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          # Магия: GitHub сам подставит уникальный номер сборки (например, v1.0.14, v1.0.15)
          tag_name: v1.0.${{ github.run_number }}
          name: "Релиз приложения v1.0.${{ github.run_number }} 🚀"
          body: "Автоматический релиз. Код успешно пересобран в облаке через батник."
          draft: false
          prerelease: false
          files: app/build/outputs/apk/release/app-release-unsigned.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
