name: Облачная сборка и обновление APK 🤖

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Проверка кода
        uses: actions/checkout@v4

      - name: Установка Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Даем права на выполнение сборщику Gradle
      - name: Разрешение на запуск Gradle
        run: chmod +x gradlew

      - name: Сборка релизного APK
        run: ./gradlew assembleRelease

      # Официальный плагин подписи из официального маркетплейса GitHub
      - name: Подпись релизного APK
        id: sign_apk
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEY_STORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          singleIo: ${{ secrets.KEY_STORE_PASSWORD }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      # Перезаписываем один и тот же постоянный релиз v1.0.0
      - name: Загрузка APK на GitHub Релизы
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Актуальная версия приложения 🚀"
          body: "Этот APK-файл пересобирается и обновляется автоматически в облаке при каждом push через батник."
          draft: false
          prerelease: false
          files: ${{ steps.sign_apk.outputs.signedReleaseFile }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
