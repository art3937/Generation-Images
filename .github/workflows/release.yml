name: Облачная сборка и обновление APK 🤖

on:
  push:
    branches: [ main, master ] # Срабатывает автоматически при пуше через батник

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Компилируем именно релизную (оптимизированную) версию приложения
      # Мы убрали плагины подписи, так как ты настроил автоподпись в Gradle через my_keys.jks
      # Если автоподпись в Gradle не настроена, соберется незавершенный релизный APK
      # Для полной автоматизации Гитхаб просто заберёт готовый скомпилированный файл
      Tar:
      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      # Публикуем готовый файл на страницу Релизов v1.0.0, чтобы водители могли легко его скачать
      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Актуальная версия приложения 🚀"
          body: "Этот APK-файл автоматически обновляется при каждом запуске батника на Рабочем столе."
          draft: false
          prerelease: false
          files: app/build/outputs/apk/release/app-release-unsigned.apk # Сюда пойдет скомпилированный релизный файл
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
